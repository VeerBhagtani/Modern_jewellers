<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arouse Chat</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #16181d; --muted: #6b7280; --border: #e3e6eb;
    --accent: #3b5bdb; --accent-text: #ffffff; --user: #3b5bdb; --user-text: #ffffff;
    --bot: #ffffff; --chip: #eef1f6; --code: #f3f4f7;
    --warn-bg: #fff4e0; --warn: #9a5b00; --ok-bg: #e6f6ec; --ok: #1b7a3d; --err-bg: #fdecec; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --text: #e7e9ee; --muted: #9aa3b2; --border: #262b35;
      --accent: #5c7cfa; --user: #3b5bdb; --bot: #1c2029; --chip: #262b35; --code: #12151b;
      --warn-bg: #3a2a0f; --warn: #f5b454; --ok-bg: #0f2d1b; --ok: #5fd08a; --err-bg: #3a1414; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand { font-weight: 700; letter-spacing: .2px; }
  .status {
    font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--muted);
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status.warn { background: var(--warn-bg); color: var(--warn); }
  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.err { background: var(--err-bg); color: var(--err); }
  .spacer { flex: 1; }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); border-radius: 8px; padding: 6px 12px; white-space: nowrap;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; overflow-y: auto; }
  #log { max-width: 820px; margin: 0 auto; padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 12px; }
  .empty { text-align: center; color: var(--muted); margin-top: 12vh; }
  .empty h1 { font-size: 22px; color: var(--text); margin: 0 0 6px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .suggest button { font-size: 13.5px; border-radius: 999px; background: var(--panel); white-space: normal; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.assistant.fail { border-color: var(--warn); }
  .msg.error { align-self: center; background: var(--err-bg); color: var(--err); font-size: 13.5px; }
  .label { font-size: 11.5px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .fail .label { color: var(--warn); }
  details.steps { margin-top: 8px; font-size: 13px; white-space: normal; }
  details.steps summary { cursor: pointer; color: var(--muted); }
  .step { margin: 6px 0 0; padding-left: 10px; border-left: 2px solid var(--border); }
  .step .k { color: var(--muted); font-size: 12px; }
  .step pre {
    margin: 2px 0 0; padding: 6px 8px; background: var(--code); border-radius: 6px; overflow-x: auto;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .step.ok pre { border-left: 3px solid var(--ok); }
  .step.bad pre { border-left: 3px solid var(--err); }
  .thinking { color: var(--muted); }
  footer { background: var(--panel); border-top: 1px solid var(--border); padding: 12px 16px; }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  #input {
    flex: 1; resize: none; max-height: 180px; min-height: 42px; padding: 10px 12px; font: inherit;
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text);
  }
  #input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .note { max-width: 820px; margin: 6px auto 0; font-size: 11.5px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<header>
  <span class="brand">Arouse</span>
  <span id="status" class="status">connecting…</span>
  <span class="spacer"></span>
  <button id="newBtn" type="button">New chat</button>
</header>
<main id="scroller">
  <div id="log"></div>
</main>
<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask Arouse to do something…" title="Enter to send · Shift+Enter for a new line"></textarea>
    <button id="sendBtn" class="primary" type="button">Send</button>
  </div>
  <div class="note" id="note">Arouse runs locally on its own weights. Tools run in a local sandbox.</div>
</footer>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), sendBtn = $("sendBtn");
  const SUGGESTIONS = [
    "Remind me tomorrow at 8 AM to check sales.",
    "Every Monday at 9 AM remind me to pay the staff.",
    "Remind me tomorrow to call the vet.",
    "What reminders do I have?",
    "How many lines are in sales.csv?",
    "Note that the feed delivery is late.",
  ];
  let sessionId = null, busy = false;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const scrollDown = () => { const s = $("scroller"); s.scrollTop = s.scrollHeight; };

  function showEmpty() {
    log.innerHTML = `<div class="empty" id="empty"><h1>Arouse</h1>
      <div>Reminders, schedules, notes and files. Ask in plain language.</div>
      <div class="suggest">${SUGGESTIONS.map((s) => `<button type="button" class="sg">${esc(s)}</button>`).join("")}</div></div>`;
    log.querySelectorAll(".sg").forEach((b) => b.addEventListener("click", () => { input.value = b.textContent; send(); }));
  }

  function bubble(cls, html) {
    $("empty")?.remove();
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.innerHTML = html;
    log.appendChild(el);
    scrollDown();
    return el;
  }

  function stepHtml(s) {
    if (s.observation) {
      const ok = s.observation === "tool_result";
      return `<div class="step ${ok ? "ok" : "bad"}"><div class="k">${ok ? "tool result" : "tool error"}</div><pre>${esc(JSON.stringify(s.content))}</pre></div>`;
    }
    let h = "";
    if (s.plan) h += `<div class="step"><div class="k">plan</div>${esc(s.plan)}</div>`;
    if (s.verify) h += `<div class="step"><div class="k">verify</div>${esc(s.verify)}</div>`;
    const a = s.action;
    if (a.type === "tool_call") h += `<div class="step"><div class="k">tool call</div><pre>${esc(a.tool)} ${esc(JSON.stringify(a.arguments))}</pre></div>`;
    return h;
  }

  function render(el, res) {
    const f = res.final;
    const text = f.result ?? f.question ?? f.error ?? "";
    const label = { finish: "", ask_user: "Question", fail: "Couldn't complete" }[f.type];
    const calls = res.steps.filter((s) => s.action && s.action.type === "tool_call").map((s) => s.action.tool);
    el.className = "msg assistant" + (f.type === "fail" ? " fail" : "");
    el.innerHTML = (label ? `<div class="label">${label}</div>` : "") + esc(text) +
      `<details class="steps"><summary>${res.steps.length} step${res.steps.length === 1 ? "" : "s"}` +
      `${calls.length ? " · " + esc(calls.join(" → ")) : ""}${res.guarded ? " · guard" : ""}</summary>` +
      res.steps.map(stepHtml).join("") + `</details>`;
  }

  async function loadStatus() {
    const st = $("status");
    try {
      const m = (await (await fetch("/v1/health")).json()).model;
      const size = m.num_parameters >= 1e6 ? (m.num_parameters / 1e6).toFixed(1) + "M" : (m.num_parameters / 1e3).toFixed(0) + "K";
      st.className = "status " + (m.trained ? "ok" : "warn");
      st.textContent = `${m.name} · ${size} params · ` + (m.trained ? `trained ${m.train_steps} steps` : "UNTRAINED");
      if (!m.trained) $("note").textContent = "This model has random weights, so it cannot act reliably until trained.";
    } catch (e) {
      st.className = "status err"; st.textContent = "server offline";
    }
  }

  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = ""; autosize();
    bubble("user", esc(text));
    const el = bubble("assistant", '<span class="thinking">Working…</span>');
    busy = true; sendBtn.disabled = true;
    try {
      const r = await fetch("/v1/agent/run", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(sessionId ? { session_id: sessionId, message: text } : { message: text }),
      });
      const res = await r.json();
      if (!r.ok) throw new Error(res.error?.message || `HTTP ${r.status}`);
      sessionId = res.session_id;
      render(el, res);
    } catch (e) {
      el.remove();
      bubble("error", "Error: " + esc(e.message));
    } finally {
      busy = false; sendBtn.disabled = false; input.focus(); scrollDown();
    }
  }

  function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  sendBtn.addEventListener("click", send);
  $("newBtn").addEventListener("click", () => {
    if (sessionId) fetch("/v1/agent/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: sessionId }) });
    sessionId = null; showEmpty(); input.focus();
  });
  showEmpty(); loadStatus(); input.focus();
})();
</script>
</body>
</html>
