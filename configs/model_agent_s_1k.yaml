# Arouse agent-s with a 1024-token context (same weights shape as configs/model_agent_s.yaml; v4 onwards).
name: arouse-agent-s
vocab_size: 4096          # = tokenizer arouse-agent vocab
context_length: 1024      # agent_v4 episodes (leads, GST, answers) are longer
d_model: 256
n_layers: 6
n_heads: 8
n_kv_heads: 4
ffn_hidden_size: null     # -> 704
ffn_multiple_of: 64
rope_theta: 10000.0
norm_eps: 1.0e-05
dropout: 0.0
bias: false
tie_embeddings: true
init_std: 0.02
