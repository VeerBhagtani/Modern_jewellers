# arouse-agent-s on agent_v1 (CPU). 2200 steps x 16 x 768 tokens = 27M tokens (~1.2 epochs).
run_name: arouse-agent-s
model_config: configs/model_agent_s.yaml
data_dir: artifacts/data/agent_v1
out_dir: checkpoints/arouse-agent-s
seed: 1234
batch_size: 16
grad_accum_steps: 1
seq_len: null
max_steps: 2200
lr: 2.0e-3
min_lr: 1.0e-4
warmup_steps: 100
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
precision: fp32
device: auto
threads: 4
log_interval: 20
eval_interval: 200
eval_batches: 8
checkpoint_interval: 200
keep_checkpoints: 3
