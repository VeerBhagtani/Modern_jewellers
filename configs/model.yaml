# Arouse AI v0.1 — decoder-only Transformer, ~110M params.
# Auto fields (null) are derived; checkpoints store the resolved values.
name: arouse-v0.1
vocab_size: 32768        # must be >= trained tokenizer vocab size
context_length: 2048
d_model: 768
n_layers: 12
n_heads: 12
n_kv_heads: null         # null = n_heads (full MHA); e.g. 4 = grouped-query attention
ffn_hidden_size: null    # null = 8/3 * d_model rounded up to ffn_multiple_of (-> 2048)
ffn_multiple_of: 256
rope_theta: 10000.0
norm_eps: 1.0e-05
dropout: 0.0
bias: false
tie_embeddings: true
init_std: 0.02
