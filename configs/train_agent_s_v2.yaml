# Fine-tune arouse-agent-s on agent_v2 (calendar string + explicit date lookup), starting
# from the agent_v1 run's latest checkpoint. Same tokenizer and architecture.
run_name: arouse-agent-s-v2
model_config: configs/model_agent_s.yaml
data_dir: artifacts/data/agent_v2
out_dir: checkpoints/arouse-agent-s-v2
init_from: checkpoints/arouse-agent-s
seed: 4321
batch_size: 16
grad_accum_steps: 1
seq_len: null
max_steps: 1600
lr: 1.5e-3
min_lr: 5.0e-5
warmup_steps: 50
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
precision: fp32
device: auto
threads: 4
log_interval: 20
eval_interval: 200
eval_batches: 8
checkpoint_interval: 400
keep_checkpoints: 2
