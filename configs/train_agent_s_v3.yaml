# Continue training arouse-agent-s on agent_v3 (more phrasing variety for the measured weak spots),
# starting from the released model. Same tokenizer and architecture.
run_name: arouse-agent-s-v3
model_config: configs/model_agent_s.yaml
data_dir: artifacts/data/agent_v3
out_dir: checkpoints/arouse-agent-s-v3
init_from: models/arouse-agent-s
seed: 777
batch_size: 16
grad_accum_steps: 1
seq_len: null
max_steps: 3000
lr: 1.2e-3
min_lr: 4.0e-5
warmup_steps: 50
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
precision: fp32
device: auto
threads: 4
log_interval: 20
eval_interval: 200
eval_batches: 8
checkpoint_interval: 200
keep_checkpoints: 3
